server {
    listen 80;
    listen [::]:80;
    server_name velvet.x-zdos.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name velvet.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/velvet.x-zdos.it/fullchain.pem;
    
    location ^~ /api/velvet-pay/ {
        proxy_pass http://127.0.0.1:3050/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ssl_certificate_key /etc/letsencrypt/live/velvet.x-zdos.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/velvethub/dist/public;
    index index.html;

    location = /lodge-card.html {
        alias /var/www/ourvelvet/lodge-card.html;
        default_type text/html;
    }

    location ^~ /assets/ {
        root /var/www/velvethub/dist/public;
        try_files $uri @ourvelvet_assets;
    }

    location @ourvelvet_assets {
        root /var/www/ourvelvet;
        try_files $uri =404;
    }

    location ^~ /api/solana/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/access/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/velvet/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/verify-ov/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    
    location = /badge {
        alias /var/www/velvethub/dist/public/badge.html;
        default_type text/html;
    }

    location /api/meat-radar/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/bridge/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/global-id/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/solana-rpc {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/geo/ip-radar {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/geo/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/unmineable/ {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/promo-pack {
        proxy_pass http://127.0.0.1:4188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dashboard.html {
        alias /var/www/ourvelvet/dashboard.html;
        auth_basic "OurVelvet staff";
        auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
        default_type text/html;
    }

    location = /shop.html {
        alias /var/www/ourvelvet/shop.html;
        default_type text/html;
    }

    location /api/shop/ {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /invite-gate.html {
        alias /var/www/ourvelvet/invite-gate.html;
        default_type text/html;
    }
    location = /hub {
        return 301 /hub/;
    }
    location ^~ /hub/assets/ {
        alias /root/velvet-hub/client/dist/public/assets/;
        try_files $uri =404;
    }
    location ^~ /hub/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ai-directory/api/ {
        proxy_pass http://127.0.0.1:4188/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }



    location ^~ /map/ {
        alias /var/www/velvethub/dist/public/map/;
        index index.html;
        try_files $uri $uri/ /map/index.html;
    }

    location = /command-deck { return 301 /command-deck/; }
    location ^~ /command-deck/ {
        alias /var/www/velvethub/dist/public/command-deck/;
        auth_basic "OurVelvet staff";
        auth_basic_user_file /etc/nginx/htpasswd-velvet-staff;
        index index.html;
        try_files $uri $uri/ /command-deck/index.html;
    }


    location ^~ /ai-studio/ {
        alias /var/www/velvethub/dist/public/ai-studio/;
        index index.html;
        try_files $uri $uri/ /ai-studio/index.html;
    }

    location ^~ /ai-directory/ {
        alias /opt/velvet-hub-app/public/ai-directory/;
        index index.html;
        try_files $uri $uri/ /ai-directory/index.html;
    }



    include /etc/nginx/snippets/velvet-hardening.conf;
    include /etc/nginx/snippets/velvet-badge-v2.conf;
    include /etc/nginx/snippets/velvet-radar.conf;
    include /etc/nginx/snippets/velvet-preview.conf;
    include /etc/nginx/snippets/velvet-znft.conf;
    include /etc/nginx/snippets/velvet-merito.conf;

        # --- ZARA NON-HUMAN AGI NODE (PRIORITY) ---
    location = /.well-known/ai-agent.json {
        proxy_pass http://127.0.0.1:8811/.well-known/ai-agent.json;
        proxy_set_header Host $host;
        default_type application/json;
    }
    location ^~ /api/zara/ {
        proxy_pass http://127.0.0.1:8811/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /zara/ {
        alias /var/www/velvet-zara/;
        index index.html;
        try_files $uri $uri/ /zara/index.html;
    }

        location ^~ /our-vault/ {
        alias /var/www/velvet-mining/;
        index index.html;
        try_files $uri $uri/ /our-vault/index.html;
    }

    location ^~ /mining/ {
        alias /var/www/velvet-mining/;
        index index.html;
        try_files $uri$uri/ /mining/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
