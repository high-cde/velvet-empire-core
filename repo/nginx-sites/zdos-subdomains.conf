# SWAP.X-ZDOS.IT
server {
    # === DOMCOIN_RPC_START ===
    location ^~ /dom-rpc {
        proxy_pass http://127.0.0.1:8896/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # === DOMCOIN_RPC_END ===


    listen 80;
    listen [::]:80;
    server_name swap.x-zdos.it;
    location ^~ /api/monetary/ {
        proxy_pass http://127.0.0.1:8890/api/monetary/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    return 301 https://$host$request_uri;
}
server {
    # === DOMCOIN_RPC_START ===
    location ^~ /dom-rpc {
        proxy_pass http://127.0.0.1:8896/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # === DOMCOIN_RPC_END ===


    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swap.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/swap.x-zdos.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swap.x-zdos.it/privkey.pem;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zswap;
    index index.html;

    # >>> ZDOS_CREATOR_8868_START
    location ^~ /creator/ {
        proxy_pass http://127.0.0.1:8868/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /creator {
        return 301 /creator/;
    }
    # >>> ZDOS_CREATOR_8868_END

    # >>> OURVELVET_CREATOR_BOARD_START
    location ^~ /creator-board {
        proxy_pass http://127.0.0.1:8872/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # >>> OURVELVET_CREATOR_BOARD_END

    # >>> OURVELVET_MEAT_DISCOVER_START
    location ^~ /discover {
        proxy_pass http://127.0.0.1:8878/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ^~ /radar {
        proxy_pass http://127.0.0.1:8878/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # >>> OURVELVET_MEAT_DISCOVER_END

    # >>> OURVELVET_CARDS_YEN_START
    location ^~ /ourvelvet {
        proxy_pass http://127.0.0.1:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # >>> OURVELVET_CARDS_YEN_END

    # >>> OURVELVET_RED_LIVE_START
    location ^~ /live {
        proxy_pass http://127.0.0.1:8876/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    # >>> OURVELVET_RED_LIVE_END

    # >>> OURVELVET_VACATION_CLEAN_START
    location ^~ /vacation {
        return 301 https://zx.x-zdos.it/#vacation-sec;
    }
    # >>> OURVELVET_VACATION_CLEAN_END









    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

