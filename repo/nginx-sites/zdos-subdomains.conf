# SWAP.X-ZDOS.IT
server {
    listen 80;
    listen [::]:80;
    server_name swap.x-zdos.it;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name swap.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/x-zdos.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x-zdos.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zswap;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# QUEST.X-ZDOS.IT (attivo su 127.0.0.1:3200)
server {
    listen 80;
    listen [::]:80;
    server_name quest.x-zdos.it;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quest.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/x-zdos.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x-zdos.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ZDESK.X-ZDOS.IT (attivo su 127.0.0.1:8787)
server {
    if ($host = zdesk.x-zdos.it) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name zdesk.x-zdos.it;
    return 301 https://$host$request_uri;


}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zdesk.x-zdos.it;
    auth_basic "ZDESK";
    auth_basic_user_file /etc/nginx/zdesk.htpasswd;
    ssl_certificate /etc/letsencrypt/live/x-zdos.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/x-zdos.it/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

# APP.X-ZDOS.IT
server {
    listen 80;
    listen [::]:80;
    server_name app.x-zdos.it;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.x-zdos.it;

    ssl_certificate /etc/letsencrypt/live/x-zdos.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x-zdos.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # DSN-X market-ready: app.x-zdos.it dismesso, tutto verso x-zdos.it (admin.html non più pubblico)
    location = /downloads.html { return 301 https://x-zdos.it/downloads.html; }
    location = /forge { return 301 /forge/; }
    location ^~ /forge/ {
        alias /var/www/zdos-portal/;
        index forge.html;
        try_files /forge.html =404;
    }

    location ^~ /api/forge/ {
        proxy_pass http://127.0.0.1:8833/;
        proxy_set_header Host $host;
    }

    location / { return 301 https://x-zdos.it/; }
}
